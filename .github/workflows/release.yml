name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('src-tauri/tauri.conf.json')).version)")
          echo "tag=$TAG tauri.conf.json=$CONF"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag v$TAG does not match tauri.conf.json version $CONF. Run: deno task version $TAG"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2 \
            squashfs-tools \
            file \
            rpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: deno install --frozen --allow-scripts

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # Deno's task runner accepts VAR=value on every OS; npm scripts on Windows do not.
          tauriScript: deno task tauri
          tagName: v__VERSION__
          releaseName: Tempura v__VERSION__
          releaseBody: |
            Desktop installers for Linux, Windows, and macOS.

            Prefer the [download page](https://vcostin.github.io/tempura/) — it picks the build for your OS.

            SHA-256 sums are in `SHA256SUMS` on this release (uploaded after all platform jobs finish).
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.args }}

  checksums:
    name: Upload SHA256SUMS
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Write SHA256SUMS from GitHub asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          python3 - <<'PY'
          import json, os, subprocess, sys

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
              text=True,
          )
          release = json.loads(raw)
          lines = []
          for asset in release.get("assets") or []:
              name = asset.get("name") or ""
              digest = asset.get("digest") or ""
              if name == "SHA256SUMS" or not digest.startswith("sha256:"):
                  continue
              lines.append(f"{digest[len('sha256:'):]}  {name}")
          if not lines:
              sys.exit("no sha256 digests on release assets")
          text = "\n".join(sorted(lines, key=lambda line: line.split()[-1])) + "\n"
          open("SHA256SUMS", "w", encoding="utf-8").write(text)
          sys.stdout.write(text)
          PY
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
