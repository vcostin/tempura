name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, a11y
    runs-on: ubuntu-latest
    env:
      PW_DISABLE_TS_ESM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-1.60.0-${{ hashFiles('deno.lock') }}

      - name: Install dependencies (frozen lockfile)
        run: deno ci

      - name: Typecheck + production build
        run: deno task build

      - name: Unit tests
        run: deno task test:unit

      - name: Install Playwright Chromium (+ OS deps)
        run: deno run -A npm:@playwright/test@1.60.0/cli install --with-deps chromium

      - name: Accessibility Playwright (Deno)
        run: deno task test:a11y

  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cache .debs so WebKit/GTK deps are not re-downloaded on every PR.
      # Bump `version` when the packages list or ubuntu-22.04 image generation changes.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        id: apt-cache
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
          version: 22.04-1
          execute_install_scripts: true

      - name: Apt cache status
        run: echo "apt cache-hit=${{ steps.apt-cache.outputs.cache-hit }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      # tauri::generate_context! needs frontendDist to exist; the UI is not under test here.
      - name: Stub frontend build
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
