name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, a11y
    runs-on: ubuntu-latest
    env:
      PW_DISABLE_TS_ESM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Cache npm / Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: ${{ runner.os }}-pw-1.60.0-${{ hashFiles('package.json', 'deno.lock') }}

      - name: Install dependencies
        run: deno install --node-modules-dir=auto --allow-scripts

      - name: Typecheck + production build
        run: deno task build

      - name: Unit tests
        run: deno task test:unit

      - name: Install Playwright Chromium (+ OS deps)
        run: deno run -A npm:@playwright/test@1.60.0/cli install --with-deps chromium

      - name: Accessibility Playwright (Deno)
        run: deno task test:a11y
