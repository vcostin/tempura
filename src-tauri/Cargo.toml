[package]
name = "tempura"
version = "0.9.1"
description = "Tempura — premium focus-rhythm timer"
authors = ["Tempura"]
edition = "2021"

[lib]
name = "tempura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Windows portable exe (a plain tempura.exe, no installer). It never installs
# updates on its own: it says a new version is out, and swaps its own file only if
# the user turns that on. Release CI builds it once more with this flag.
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
sys-locale = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSFont", "NSFontDescriptor", "NSControl", "NSButton", "NSStatusBarButton", "NSStatusItem", "NSView", "NSResponder", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false }
gtk = "0.18"
tokio = { version = "1", default-features = false, features = ["time"] }
